[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainer-radar"
dynamic = ["version"]
description = "GitHub Action and local CLI for read-only pull request triage reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "JackSpiece" }]
keywords = [
  "github",
  "maintainers",
  "open-source",
  "pull-requests",
  "triage",
  "ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
maintainer-radar = "maintainer_radar.cli:main"

[project.urls]
Homepage = "https://github.com/JackSpiece/maintainer-radar"
Issues = "https://github.com/JackSpiece/maintainer-radar/issues"
Demo = "https://jackspiece.github.io/maintainer-radar/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maintainer_radar = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "maintainer_radar.__version__" }

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
